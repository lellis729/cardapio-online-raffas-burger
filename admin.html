<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração | Rafa Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--panel:#1c1c1c;--line:#363636;--yellow:#ffc400;--muted:#aaa;--green:#25d366;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px Montserrat, sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px;font-weight:700}.primary{background:var(--yellow);color:#111}.secondary{background:#333;color:#fff}.danger{background:#4a2525;color:#ffb4b4}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:18px 24px}.brand{font-weight:800;font-size:20px}.brand b{color:var(--yellow)}h1{font-size:26px;margin:10px 0 22px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid #292929;border-radius:14px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:9vh auto}.field{display:grid;gap:7px;margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:12px;background:#292929;color:white;border:1px solid #454545;border-radius:8px}.field textarea{min-height:78px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{display:flex;gap:10px;margin:20px 0}.tab.active{background:var(--yellow);color:#111}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{padding:6px 9px;border-radius:99px;background:#333}.notice{padding:12px;border-radius:8px;margin:12px 0;background:#282828}.notice.error{color:#ffb4b4}.order{display:grid;grid-template-columns:1fr auto;gap:12px}.order h3{margin:0 0 8px}.order ul{padding-left:20px;color:#ddd}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}@media(max-width:650px){.wrap{padding:16px}.row{grid-template-columns:1fr}.top{padding:14px 16px}.order{grid-template-columns:1fr}.tabs{overflow:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand">RAFA <b>BURGER</b> <span class="muted">/ Admin</span></div><button id="logout" class="secondary hidden">Sair</button></header>
<main class="wrap">
<section id="login-card" class="card login"><h1>Painel administrativo</h1><p class="muted">Entre com o usuário administrador do Supabase.</p><div id="login-msg" class="notice hidden"></div><form id="login-form"><label class="field">E-mail<input id="email" type="email" autocomplete="username" required></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button></form></section>
<section id="dashboard" class="hidden"><h1>Painel administrativo</h1><div id="app-msg" class="notice hidden"></div><nav class="tabs"><button class="tab active" data-tab="orders">Pedidos</button><button class="tab secondary" data-tab="products">Produtos</button></nav>
<section id="orders-panel"><div class="toolbar"><h2>Pedidos</h2><button id="refresh-orders" class="secondary">Atualizar</button></div><div id="orders-list"></div></section>
<section id="products-panel" class="hidden"><div class="toolbar"><h2>Produtos</h2><button id="new-product" class="primary">Novo produto</button></div><form id="product-form" class="card hidden"><h3 id="form-title">Novo produto</h3><input id="product-id" type="hidden"><div class="row"><label class="field">Nome<input id="product-name" required maxlength="120"></label><label class="field">Categoria<input id="product-category" required maxlength="80"></label></div><label class="field">Descrição<textarea id="product-description" maxlength="500"></textarea></label><div class="row"><label class="field">Preço (R$)<input id="product-price" type="number" min="0" step="0.01" required></label><label class="field">URL da imagem<input id="product-image" type="url"></label></div><label class="field"><span><input id="product-active" type="checkbox" checked> Produto ativo no cardápio</span></label><div class="actions"><button class="primary" type="submit">Salvar</button><button id="cancel-product" type="button" class="secondary">Cancelar</button></div></form><div class="card table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Visibilidade</th><th>Ações</th></tr></thead><tbody id="products-list"></tbody></table></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Preencha com Project URL e anon/public key em Supabase > Project Settings > API.
// Nunca use a chave service_role neste arquivo.
const SUPABASE_URL = "COLE_AQUI_A_PROJECT_URL";
const SUPABASE_ANON_KEY = "COLE_AQUI_A_ANON_PUBLIC_KEY";
const configured = SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.startsWith("eyJ");
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
const $ = id => document.getElementById(id);
const money = n => Number(n || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(id,text,error=false){const el=$(id);el.textContent=text;el.classList.toggle("hidden",!text);el.classList.toggle("error",error)}
function setSession(session){$("login-card").classList.toggle("hidden",!!session);$("dashboard").classList.toggle("hidden",!session);$("logout").classList.toggle("hidden",!session);if(session)loadOrders()}
async function loadProducts(){const {data,error}=await sb.from("products").select("id,name,category,description,price,image_url,active").order("category").order("name");if(error)throw error;$("products-list").innerHTML=(data||[]).map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><small class="muted">#${p.id}</small></td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.active?"Ativo":"Oculto"}</td><td><div class="actions"><button class="secondary" onclick="editProduct(${Number(p.id)})">Editar</button><button class="danger" onclick="toggleProduct(${Number(p.id)},${!p.active})">${p.active?"Ocultar":"Ativar"}</button></div></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Nenhum produto cadastrado.</td></tr>';window.productRows=data||[]}
async function loadOrders(){message("app-msg","");const {data:orders,error}=await sb.from("orders").select("id,customer_name,fulfillment_type,address,payment_method,notes,status,total,created_at,order_items(product_name,unit_price,quantity,line_total)").order("created_at",{ascending:false}).limit(100);if(error){message("app-msg","Não foi possível carregar pedidos. Confira as políticas do banco: "+error.message,true);return}const statuses=["novo","confirmado","preparando","saiu_entrega","concluido","cancelado"];$("orders-list").innerHTML=(orders||[]).map(o=>`<article class="card order"><div><h3>${esc(o.customer_name)} <span class="status">${esc(o.status)}</span></h3><div class="muted">${new Date(o.created_at).toLocaleString("pt-BR")} · ${esc(o.fulfillment_type)} · ${esc(o.payment_method)}</div>${o.address?`<p>Endereço: ${esc(o.address)}</p>`:""}${o.notes?`<p>Obs.: ${esc(o.notes)}</p>`:""}<ul>${(o.order_items||[]).map(i=>`<li>${Number(i.quantity)}× ${esc(i.product_name)} — ${money(i.line_total)}</li>`).join("")}</ul><strong>Total: ${money(o.total)}</strong></div><label class="field">Status<select onchange="updateOrderStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?"selected":""} value="${s}">${s.replaceAll("_"," ")}</option>`).join("")}</select></label></article>`).join("")||'<div class="card muted">Ainda não há pedidos.</div>'}
async function updateOrderStatus(id,status){const {error}=await sb.from("orders").update({status}).eq("id",id);if(error)message("app-msg","Falha ao atualizar pedido: "+error.message,true);else message("app-msg","Status do pedido atualizado.")}
window.editProduct=id=>{const p=window.productRows.find(x=>Number(x.id)===id);if(!p)return;$("product-id").value=p.id;$("product-name").value=p.name;$("product-category").value=p.category;$("product-description").value=p.description||"";$("product-price").value=p.price;$("product-image").value=p.image_url||"";$("product-active").checked=p.active;$("form-title").textContent="Editar produto";$("product-form").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};
window.toggleProduct=async(id,active)=>{const {error}=await sb.from("products").update({active}).eq("id",id);if(error)message("app-msg","Falha ao atualizar produto: "+error.message,true);else{message("app-msg","Produto atualizado.");loadProducts()}};
$("login-form").addEventListener("submit",async e=>{e.preventDefault();if(!sb){message("login-msg","Configure a Project URL e a anon/public key no início deste arquivo.",true);return}const {data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)message("login-msg","Não foi possível entrar: "+error.message,true);else{message("login-msg","");setSession(data.session)}});
$("logout").onclick=async()=>{await sb.auth.signOut();setSession(null)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("orders-panel").classList.toggle("hidden",b.dataset.tab!=="orders");$("products-panel").classList.toggle("hidden",b.dataset.tab!=="products");if(b.dataset.tab==="products")loadProducts().catch(e=>message("app-msg","Falha ao carregar produtos: "+e.message,true))});
$("refresh-orders").onclick=loadOrders;$("new-product").onclick=()=>{$("product-form").reset();$("product-id").value="";$("form-title").textContent="Novo produto";$("product-form").classList.remove("hidden")};$("cancel-product").onclick=()=>$("product-form").classList.add("hidden");
$("product-form").addEventListener("submit",async e=>{e.preventDefault();const id=$("product-id").value;const row={name:$("product-name").value.trim(),category:$("product-category").value.trim(),description:$("product-description").value.trim(),price:Number($("product-price").value),image_url:$("product-image").value.trim()||null,active:$("product-active").checked};let result;if(id)result=await sb.from("products").update(row).eq("id",id);else result=await sb.from("products").insert(row);if(result.error){message("app-msg","Não foi possível salvar. "+result.error.message,true);return}$("product-form").classList.add("hidden");message("app-msg","Produto salvo.");await loadProducts()});
if(!configured)message("login-msg","Configure a Project URL e a anon/public key no início deste arquivo.",true);else sb.auth.getSession().then(({data})=>setSession(data.session));
</script></body></html>
