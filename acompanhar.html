<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Acompanhar pedido | Rafa Burger"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101010;color:#fff;font:16px Montserrat,Arial,sans-serif;padding:20px}.card{width:min(100%,500px);background:#1c1c1c;border:1px solid #383838;border-radius:16px;padding:28px}h1{font-size:24px}.yellow{color:#ffc400}.steps{display:grid;gap:10px;margin:24px 0}.step{padding:14px;background:#292929;border-radius:9px;color:#999}.step.active{color:#ffc400;border:1px solid #ffc400}.error{color:#ff8585}.muted{color:#aaa;font-size:13px}a{color:#ffc400}</style></head><body><main class="card"><h1>🍔 Acompanhe seu pedido</h1><p id="number" class="yellow"></p><div id="status" class="steps"></div><p id="updated" class="muted">Buscando atualização…</p><p id="error" class="error"></p><a href="/">Voltar ao cardápio</a></main><script>
const token=new URLSearchParams(location.search).get('token'),labels={received:'🟡 Pedido recebido',preparing:'🔵 Em preparação',out_for_delivery:'🟣 Saiu para entrega',completed:'🟢 Pedido concluído',cancelled:'🔴 Pedido cancelado'};const orderStates=['received','preparing','out_for_delivery','completed'];async function refresh(){if(!token){document.getElementById('error').textContent='Link de acompanhamento inválido.';return}try{const r=await fetch('/api/track?token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('number').textContent='Pedido '+d.number;const cancelled=d.status==='cancelled';document.getElementById('status').innerHTML=cancelled?'<div class="step active">'+labels.cancelled+'</div>':orderStates.map(s=>'<div class="step '+(orderStates.indexOf(s)<=orderStates.indexOf(d.status)?'active':'')+'">'+labels[s]+'</div>').join('');document.getElementById('updated').textContent='Atualizado em '+new Date(d.updatedAt).toLocaleString('pt-BR');document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}refresh();setInterval(refresh,5000);
</script></body></html>
